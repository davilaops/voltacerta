project_id = "voltacerta"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[auth]
site_url = "https://voltacerta-brown.vercel.app"
additional_redirect_urls = ["https://voltacerta-brown.vercel.app/**", "http://localhost:5173/**", "https://app.voltacerta.com.br/**", "https://admin.voltacerta.com.br/**", "https://voltacerta.com.br/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enabled = true
enable_confirmations = true

[functions.billing-webhook]
verify_jwt = false

[functions.billing-checkout]
verify_jwt = true

[functions.asaas-webhook]
verify_jwt = false
